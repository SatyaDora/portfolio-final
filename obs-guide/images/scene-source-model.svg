<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="20" y="20" width="600" height="280" rx="10" fill="#f3f3f0" stroke="#999" stroke-width="1.5"/>
  <text x="40" y="52" font-size="16" font-weight="bold" fill="#222">Scene: "Gameplay"</text>

  <rect x="50" y="80" width="160" height="90" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <text x="130" y="130" font-size="13" text-anchor="middle" fill="#222">Display Capture</text>

  <rect x="240" y="80" width="160" height="90" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <text x="320" y="130" font-size="13" text-anchor="middle" fill="#222">Webcam</text>

  <rect x="430" y="80" width="160" height="90" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <text x="510" y="130" font-size="13" text-anchor="middle" fill="#222">Microphone</text>

  <line x1="130" y1="60" x2="130" y2="80" stroke="#555" stroke-width="1.2"/>
  <line x1="320" y1="60" x2="320" y2="80" stroke="#555" stroke-width="1.2"/>
  <line x1="510" y1="60" x2="510" y2="80" stroke="#555" stroke-width="1.2"/>

  <text x="320" y="220" font-size="12" text-anchor="middle" fill="#555">Each source is an individual input; a scene groups sources into one switchable layout.</text>
